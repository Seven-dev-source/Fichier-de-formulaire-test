<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <h2><strong>Formulaire Test</strong></h2>
        <marquee behavior="alternate" direction="right"><p><i>Veuillez remplir le formulaire minicieusement</i></p></marquee>
        <link rel="stylesheet" href="form-1.css">
    </head>
    <body>
        <form action="#" method="post" class="FORM-1">
           <p>
                <strong><label for="nom">Nom:</label></strong>
                <input type="text" name="nom" id="nom" required placeholder="inserez votre nom">
           </p>

           <p>
                <strong><label for="prenom">Prénom:</label></strong>
                <input type="text" name="prenom" id="prenom" required placeholder="inserez votre prenom">
           </p>

           <p>
                <strong><label for="date-Nais">Date de Naissance:</label></strong>
                <input type="date" name="date-Nais" id="date-Nais" required placeholder="inserez votre date de naissance">
           </p>

           <p>
                <strong><label for="contact">Contact:</label></strong>
                <input type="number" name="contact" id="contact" required placeholder="inserez votre contact">
           </p>

           <p><strong><button class="send">Envoyer</button></strong></p>
        </form>
    </body>
</html>
